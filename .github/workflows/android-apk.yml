# Builds a sideloadable debug APK on GitHub's free runners ($0).
# ubuntu-24.04 ships JDK 17/21 and the Android SDK (API 36) preinstalled.
#
# Trigger: push to main / any arena branch, manual run, or tag v*.
#
# Output (all free, no login needed for releases):
#   • Every successful main build updates the rolling "latest-apk" release →
#     https://github.com/<owner>/<repo>/releases/download/latest-apk/annadata-connect-latest.apk
#     (that is the URL the landing page "Download APK (free)" button uses)
#   • A push of a v* tag creates a permanent numbered release with the APK.
#   • Every run also uploads a "annadata-connect-debug-apk" build artifact
#     (Actions → run → Artifacts).
#
# The APK is a Capacitor WebView bundle of the frontend; it talks to the backend at
# API_BASE_URL (repo variable) — set it to your Render URL, e.g.
#   https://annadata-connect.onrender.com
# You can change the server later from inside the app (login → Server address).
name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend origin the APK should call (overrides repo variable API_BASE_URL)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Priority: manual input → repo variable → placeholder (app shows a settings hint)
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://annadata-connect.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (points at ${{ env.VITE_API_BASE_URL }})
        working-directory: frontend
        run: |
          echo "API base: $VITE_API_BASE_URL"
          npm run build

      - name: Sync Capacitor → android/
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Rename APK
        run: |
          mkdir -p out
          SHORT=$(git rev-parse --short HEAD)
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "out/annadata-connect-${SHORT}.apk"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "out/annadata-connect-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annadata-connect-debug-apk
          path: out/*.apk
          retention-days: 30

      # Rolling free download with a STABLE url (no login, no 30-day expiry):
      # github.com/<owner>/<repo>/releases/latest/download/annadata-connect-latest.apk
      - name: Publish rolling “latest” release (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          # Replace the previous rolling release + its tag, if present.
          if gh api "repos/$REPO/releases/tags/latest-apk" >/dev/null 2>&1; then
            REL_ID=$(gh api "repos/$REPO/releases/tags/latest-apk" --jq .id)
            gh api -X DELETE "repos/$REPO/releases/$REL_ID" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/git/refs/tags/latest-apk" >/dev/null 2>&1 || true
          fi
          gh release create latest-apk out/annadata-connect-latest.apk \
            --target "$SHA" \
            --title "Annadata Connect — free Android APK (latest)" \
            --notes "Automatically built by GitHub Actions from the latest main commit. Free side-loadable APK — no app store, ₹0.

Install: allow “install unknown apps” for your browser/downloads app, open the APK, then tap Install.

The app needs a backend server address (login screen → Server address)."

      - name: Attach APK to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
