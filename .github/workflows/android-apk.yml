name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://annadata-connect.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor into android
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK files
        run: |
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk out/annadata-connect-latest.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: annadata-connect-debug-apk
          path: out/annadata-connect-latest.apk
          retention-days: 30

      - name: Publish free rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release delete latest-apk --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest-apk out/annadata-connect-latest.apk --repo "$REPO" --target "${{ github.sha }}" --title "Annadata Connect free Android APK (latest)" --notes 'Free side-loadable APK, rebuilt automatically on every push to main. No app store, zero cost. After install, set the backend server address on the login screen (Server address link).'

      - name: Attach APK to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/annadata-connect-latest.apk
          generate_release_notes: true
