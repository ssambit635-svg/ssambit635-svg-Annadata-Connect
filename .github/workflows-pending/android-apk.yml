# Builds a sideloadable debug APK on GitHub's free runners ($0).
# ubuntu-24.04 ships JDK 17/21 and the Android SDK (API 36) preinstalled.
#
# Trigger: push to main / any arena branch, manual run, or tag v*.
# Output : "annadata-connect-debug-apk" artifact (Actions → run → Artifacts)
#          plus a GitHub Release with the APK attached when you push a tag.
#
# The APK is a Capacitor WebView bundle of the frontend; it talks to the backend at
# API_BASE_URL (repo variable) — set it to your Render URL, e.g.
#   https://annadata-connect.onrender.com
name: Android APK

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend origin the APK should call (overrides repo variable API_BASE_URL)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Priority: manual input → repo variable → placeholder (app shows a settings hint)
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://annadata-connect.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (points at ${{ env.VITE_API_BASE_URL }})
        working-directory: frontend
        run: |
          echo "API base: $VITE_API_BASE_URL"
          npm run build

      - name: Sync Capacitor → android/
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Rename APK
        run: |
          mkdir -p out
          SHORT=$(git rev-parse --short HEAD)
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "out/annadata-connect-${SHORT}.apk"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "out/annadata-connect-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annadata-connect-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
